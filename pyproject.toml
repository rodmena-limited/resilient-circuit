[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-circuit"
version = "0.7.0"
description = "A resilient circuit breaker and retry library with PostgreSQL support for distributed systems"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Farshid Ashouri", email = "farsheed.ashouri@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.9"
dependencies = [
    "typing-extensions>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    # ruff is the single formatter+linter (black/isort roles); the floor pins
    # the version that formats code blocks inside markdown so the format gate
    # is reproducible across environments
    "ruff>=0.16.0",
]
postgres = [
    "psycopg>=3.1.0",
    "python-dotenv>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
]

[project.urls]
Homepage = "https://github.com/rodmena-limited/resilient-circuit"
Repository = "https://github.com/rodmena-limited/resilient-circuit"
Documentation = "https://resilient-circuit.readthedocs.io"

[project.scripts]
resilient-circuit-cli = "resilient_circuit.cli:main"

[tool.setuptools.packages.find]
include = ["resilient_circuit*"]

[tool.setuptools.package-data]
resilient_circuit = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B904",  # Within an except clause, raise exceptions with from e or from None
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["pytest.*", "_pytest.*"]
follow_imports = "skip"
